<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>
<style>
:root {
  --ذهبي: #8b5a2b;
  --ورق: #fff9eb;
  --حبر: #2c2418;
  --حد: #c8b89e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Amiri', serif;
  background: #f4ede0;
  color: var(--حبر);
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, var(--ذهبي), #5c3c20);
  color: #fff;
  padding: 14px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 100;
}
.زر-جانب {
  position: absolute;
  top: 10px;
  background: rgba(255,255,255,0.2);
  border: none;
  color: #fff;
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}
.يمين { right: 12px; }
.يسار { left: 12px; }
.تحكم {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  background: rgba(255,249,235,0.8);
  border-bottom: 1px solid var(--حد);
  justify-content: center;
}
.تحكم button, .تحكم select {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  background: var(--ذهبي);
  color: #fff;
  cursor: pointer;
  font-size: 14px;
}
.تحكم select {
  background: #fff;
  color: var(--حبر);
  border: 1px solid var(--حد);
}
.حاوية {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 15px;
}
.رقم-الصفحة {
  text-align: center;
  color: var(--ذهبي);
  margin: 8px 0;
  font-size: 16px;
}
.مصحف {
  background: var(--ورق);
  padding: 40px 25px;
  border-radius: 8px;
  box-shadow: 0 5px 15px rgba(92,60,32,0.15);
  min-height: 600px;
  position: relative;
  border: 1px solid var(--حد);
}
.مصحف::before {
  content: '';
  position: absolute;
  top: 14px; bottom: 14px; left: 14px; right: 14px;
  border: 2px solid var(--ذهبي);
  border-radius: 4px;
}
.مصحف::after {
  content: '';
  position: absolute;
  top: 10px; bottom: 10px; left: 10px; right: 10px;
  border: 1px solid rgba(139,90,43,0.25);
  border-radius: 6px;
}
.زاوية {
  position: absolute;
  width: 36px;
  height: 36px;
  border: 2px solid var(--ذهبي);
}
.علوي-يسار { top: 18px; left: 18px; border-right: none; border-bottom: none; }
.علوي-يمين { top: 18px; right: 18px; border-left: none; border-bottom: none; }
.سفلي-يسار { bottom: 18px; left: 18px; border-right: none; border-top: none; }
.سفلي-يمين { bottom: 18px; right: 18px; border-left: none; border-top: none; }
.عنوان-السورة {
  text-align: center;
  font-size: 26px;
  color: var(--ذهبي);
  font-weight: bold;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--حد);
  margin-bottom: 25px;
  position: relative;
  z-index: 1;
}
.آيات {
  text-align: center;
  line-height: 3;
  font-size: 26px;
  position: relative;
  z-index: 1;
}
.آية {
  display: inline;
  margin: 0 3px;
}
.رقم-الآية {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  background: var(--ذهبي);
  color: #fff;
  border-radius: 50%;
  font-size: 13px;
  margin: 0 5px;
  vertical-align: middle;
}
.أزرار-التنقل {
  display: flex;
  justify-content: space-between;
  margin-top: 25px;
  gap: 12px;
}
.أزرار-التنقل button {
  flex: 1;
  padding: 14px;
  font-size: 17px;
  background: var(--ذهبي);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.قائمة-جانبية {
  position: fixed;
  top: 0;
  right: 0;
  width: 320px;
  height: 100vh;
  background: var(--ورق);
  box-shadow: -3px 0 12px rgba(0,0,0,0.15);
  z-index: 200;
  overflow-y: auto;
  transform: translateX(100%);
  transition: 0.3s;
}
.مفتوح { transform: translateX(0); }
.رأس-القائمة {
  background: var(--ذهبي);
  color: #fff;
  padding: 14px;
  text-align: center;
  font-weight: bold;
  position: relative;
}
.إغلاق {
  position: absolute;
  top: 10px;
  left: 10px;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
}
.سورة-رابط {
  padding: 14px 20px;
  border-bottom: 1px solid #e0d5c0;
  cursor: pointer;
  font-size: 17px;
}
.سورة-رابط:hover { background: rgba(139,90,43,0.08); }
</style>
</head>
<body>

<header>
  <button class="زر-جانب يسار" onclick="فتحقائمةالسور()">📖 قائمة السور</button>
  القرآن الكريم
  <button class="زر-جانب يمين" onclick="فتحالإعدادات()">⚙️ الإعدادات</button>
</header>

<div class="تحكم">
  <select id="القارئ">
    <option>الشيخ ماهر المعيقلي</option>
    <option>الشيخ السديس</option>
    <option>الشيخ العفاسي</option>
  </select>
  <button onclick="تشغيل()">🔊 استماع</button>
  <button onclick="تغييرالحجم(-2)">تصغير الخط</button>
  <button onclick="تغييرالحجم(2)">تكبير الخط</button>
</div>

<div class="حاوية">
  <div class="رقم-الصفحة" id="رقم-الصفحة">الصفحة 1</div>
  <div class="مصحف" id="المصحف">
    <div class="زاوية علوي-يسار"></div>
    <div class="زاوية علوي-يمين"></div>
    <div class="زاوية سفلي-يسار"></div>
    <div class="زاوية سفلي-يمين"></div>
    <div class="عنوان-السورة" id="عنوان-السورة"></div>
    <div class="آيات" id="الآيات"></div>
  </div>
  <div class="أزرار-التنقل">
    <button onclick="السابق()">← السابق</button>
    <button onclick="التالي()">التالي →</button>
  </div>
</div>

<div class="قائمة-جانبية" id="قائمة-السور">
  <div class="رأس-القائمة">
    <button class="إغلاق" onclick="إغلاقالكل()">×</button>
    قائمة السور
  </div>
  <div id="محتوى-قائمة-السور"></div>
</div>

<div class="قائمة-جانبية" id="الإعدادات">
  <div class="رأس-القائمة">
    <button class="إغلاق" onclick="إغلاقالكل()">×</button>
    الإعدادات
  </div>
  <div style="padding:25px;">
    <p>حجم الخط: <span id="حجم-الخط">26</span></p>
    <p style="margin-top:10px;">✅ يعمل بدون إنترنت</p>
    <p>✅ تصميم مثل المصحف</p>
  </div>
</div>

<script>
let الحالي = 0;
let حجمالخط = 26;

const السور = [
  {اسم: "سورة الفاتحة", صفحة: 1, آيات: [
    "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
    "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
    "الرَّحْمَٰنِ الرَّحِيمِ",
    "مَالِكِ يَوْمِ الدِّينِ",
    "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
    "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
    "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"
  ]},
  {اسم: "سورة الإخلاص", صفحة: 934, آيات: [
    "قُلْ هُوَ اللَّهُ أَحَدٌ",
    "اللَّهُ الصَّمَدُ",
    "لَمْ يَلِدْ وَلَمْ يُولَدْ",
    "وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ"
  ]},
  {اسم: "سورة الفلق", صفحة: 935, آيات: [
    "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",
    "مِنْ شَرِّ مَا خَلَقَ",
    "وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ",
    "وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ",
    "وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ"
  ]},
  {اسم: "سورة الناس", صفحة: 936, آيات: [
    "قُلْ أَعُوذُ بِرَبِّ النَّاسِ",
    "مَلِكِ النَّاسِ",
    "إِلَٰهِ النَّاسِ",
    "مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ",
    "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ",
    "مِنَ الْجِنَّةِ وَالنَّاسِ"
  ]}
];

function بناءالقائمة() {
  const قائمة = document.getElementById('محتوى-قائمة-السور');
  قائمة.innerHTML = '';
  السور.forEach((سورة, رقم) => {
    const عنصر = document.createElement('div');
    عنصر.className = 'سورة-رابط';
    عنصر.textContent = سورة.اسم;
    عنصر.onclick = () => {
      الحالي = رقم;
      عرضالسورة();
      إغلاقالكل();
    };
    قائمة.appendChild(عنصر);
  });
}

function عرضالسورة() {
  const سورة = السور[الحالي];
  document.getElementById('رقم-الصفحة').textContent = 'الصفحة ' + سورة.صفحة;
  document.getElementById('عنوان-السورة').textContent = سورة.اسم;
  document.getElementById('الآيات').innerHTML = سورة.آيات.map((آية, الترتيب) => 
    `<span class="آية">${آية}<span class="رقم-الآية">${الترتيب+1}</span></span>`
  ).join('');
  document.getElementById('حجم-الخط').textContent = حجمالخط;
  document.getElementById('الآيات').style.fontSize = حجمالخط + 'px';
}

function السابق() { if (الحالي > 0) { الحالي--; عرضالسورة(); } }
function التالي() { if (الحالي < السور.length - 1) { الحالي++; عرضالسورة(); } }
function تغييرالحجم(مقدار) { حجمالخط = Math.max(20, Math.min(34, حجمالخط + مقدار)); عرضالسورة(); }
function فتحقائمةالسور() {
  document.getElementById('قائمة-السور').classList.toggle('مفتوح');
  document.getElementById('الإعدادات').classList.remove('مفتوح');
}
function فتحالإعدادات() {
  document.getElementById('الإعدادات').classList.toggle('مفتوح');
  document.getElementById('قائمة-السور').classList.remove('مفتوح');
}
function إغلاقالكل() {
  document.getElementById('قائمة-السور').classList.remove('مفتوح');
  document.getElementById('الإعدادات').classList.remove('مفتوح');
}
function تشغيل() {
  alert('🔊 جاري تشغيل تلاوة:\n' + السور[الحالي].اسم + '\nالقارئ: ' + document.getElementById('القارئ').value);
}

بناءالقائمة();
عرضالسورة();
</script>
</body>
</html>
